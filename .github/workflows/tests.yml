name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          # Aikiu valida BOT_TOKEN y GROQ_API_KEY al importar el módulo
          # (varios tests hacen `import aikiu`). En CI usamos valores dummy:
          # los tests mockean todas las llamadas reales al bot y al LLM.
          BOT_TOKEN: ci-fake-bot-token
          GROQ_API_KEY: ci-fake-groq-key
          # Override de owner para que los tests de saludo proactivo
          # encuentren un adulto "registrado" sin necesitar state.json.
          CHAT_ID: "1"
        run: pytest -q
