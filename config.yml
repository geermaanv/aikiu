# ============================================================
# Aikiu — Template global (sin secretos — van en .env)
# ============================================================
#
# Estos valores son los DEFAULTS para hogares nuevos. Cada hogar
# (instances/<chat_id>/state.json) puede sobrescribir cualquier campo
# por separado. Los datos personales (nombre, ciudad, voz) los
# completa cada adulto en el primer /start (wizard de onboarding) o
# después con /configurar desde el bot familiar.
#
# Mantené este archivo SIN nombres propios ni datos de un adulto
# concreto — es el esqueleto compartido.
# ============================================================

# --- Identidad por defecto ---
# Vacío → cada hogar usa lo que cargó en el wizard de onboarding.
# El nombre del asistente ("Clara") es el default de marca y se puede
# personalizar por hogar.
nombre_adulto_mayor: ""
nombre_asistente: "Clara"
ciudad: ""

# --- Perfil del asistente ---
# Archivo markdown con el perfil completo de la persona y las instrucciones de comportamiento
perfil: "perfil.md"

# --- Voz TTS ---
# Opciones en español: es-AR-ElenaNeural, es-AR-TomasNeural, es-ES-ElviraNeural
voz_tts: "es-AR-ElenaNeural"

# --- Modelo LLM ---
modelo_llm: "llama-3.3-70b-versatile"

# --- Saludo diario ---
saludo_diario:
  activo: true
  hora: "08:30"

# --- Análisis nocturno (aprendizajes + ajustes de conversación) ---
analisis_nocturno_hora: "23:30"

# --- Alerta de inactividad ---
alerta_inactividad:
  activa: true
  horas_umbral: 4      # horas sin mensaje para alertar
  checks:
    - "11:30"          # check de la mañana (después del saludo)
    - "19:00"          # check de la tarde

# --- Recordatorios ---
# Genéricos, sin nombre propio. El LLM los recibe y los puede
# personalizar con el nombre del adulto del hogar al enviarlos.
recordatorios:
  - hora: "09:00"
    mensaje: "Es hora del medicamento de la mañana."
  - hora: "21:00"
    mensaje: "Ya es tarde, pensá en descansar."
