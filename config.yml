# ============================================================
# Aikiu — Configuración (sin secretos — van en .env)
# ============================================================

# --- Identidad ---
nombre_adulto_mayor: "Rosa"
nombre_asistente: "Clara"      # ← el familiar elige el nombre
ciudad: "Olivos, Buenos Aires" # ← usada en el saludo matutino con temperatura

# --- Perfil del asistente ---
# Archivo markdown con el perfil completo de la persona y las instrucciones de comportamiento
perfil: "perfil.md"

# --- Voz TTS ---
# Opciones en español: es-AR-ElenaNeural, es-AR-TomasNeural, es-ES-ElviraNeural
voz_tts: "es-AR-ElenaNeural"

# --- Modelo LLM ---
modelo_llm: "llama-3.3-70b-versatile"

# --- Saludo diario ---
saludo_diario:
  activo: true
  hora: "08:30"

# --- Recordatorios ---
recordatorios:
  - hora: "09:00"
    mensaje: "Rosa, ¿tomaste el medicamento de la mañana?"
  - hora: "21:00"
    mensaje: "Rosa, ¿cómo estuvo tu día? Ya es tarde, pensá en descansar."
